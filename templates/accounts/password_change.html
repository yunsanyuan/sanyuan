{% extends "base.html" %}
{% block title %}修改密码 · 花间集{% endblock %}
{% block content %}
<header class="shop-head">
  <div>
    <h1>修改密码</h1>
    <p class="muted">账号 {{ user.username }}，请输入当前密码和新密码。</p>
  </div>
  <a class="btn btn-ghost" href="{% url 'members:profile' %}">返回资料</a>
</header>
<section class="card profile-card">
  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
      <label>{{ field.label }}{{ field }}{{ field.errors }}</label>
    {% endfor %}
    <button class="btn" type="submit">更新密码</button>
  </form>
</section>
{% endblock %}
